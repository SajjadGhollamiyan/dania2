<title>تغییر رمز عبور | دانیا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F3F4FA;--card:#FFFFFF;--ink:#181828;--ink-soft:#71718F;--ink-faint:#A5A5C0;
  --line:#E9E9F4;--primary:#5B47E0;--primary-light:#7A69E8;--primary-bg:#EEEBFC;
  --primary-grad:linear-gradient(135deg,var(--primary),var(--primary-light));
  --rose:#E63B5C;--rose-bg:#FCE9ED;--emerald:#0EA672;--emerald-bg:#E4F7EE;
  --shadow-sm:0 1px 2px rgba(24,24,40,.05);--shadow-md:0 6px 16px -4px rgba(24,24,40,.09),0 2px 5px rgba(24,24,40,.05);
  --shadow-lg:0 24px 55px -14px rgba(24,24,40,.20),0 4px 14px rgba(24,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Vazirmatn',sans-serif;color:var(--ink);background:radial-gradient(720px 420px at 92% -8%,rgba(91,71,224,.07),transparent 60%),var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:380px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.logo{width:min(128px,38vw);height:auto;display:block}
.brand p{margin:0;font-size:12.5px;color:var(--ink-faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow-sm)}
h1{margin:0 0 7px;font-size:18px;font-weight:800;letter-spacing:-.2px;text-align:center}
.subtitle{margin:0 0 20px;text-align:center;color:var(--ink-soft);font-size:12.5px;line-height:1.9}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.pw-wrap{position:relative}
input{width:100%;height:44px;padding:0 13px 0 42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:.15s}
input:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px var(--primary-bg)}
.pw-toggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--ink-faint);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-family:inherit;padding:0}
.pw-toggle:hover{color:var(--primary);background:var(--primary-bg)}
.eye-icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye-off{display:none}
.pw-toggle.is-visible .eye-open{display:none}
.pw-toggle.is-visible .eye-off{display:block}
.btn{width:100%;height:44px;border:0;border-radius:10px;background:#5B47E0 !important;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s;margin-top:4px}
.btn:hover{background:#4E3CCB;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.back{display:block;margin:16px auto 0;text-align:center;color:var(--primary);font-size:12.5px;text-decoration:none;font-weight:600;width:max-content;padding:5px 8px;border-radius:8px;transition:.15s}
.back:hover{background:var(--primary-bg);color:#4938C8}
.message{font-size:12.5px;line-height:1.8;padding:10px 12px;border-radius:10px;margin-bottom:14px;display:none}
.message.error{display:block;color:var(--rose);background:var(--rose-bg)}
.message.success{display:block;color:var(--emerald);background:var(--emerald-bg)}
@media(max-width:420px){.page{padding:16px}.card{padding:20px}}
</style>
</head>

<script>
const SUPABASE_URL='https://zwkzzwgkntyasliicksx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_kUT2ACnJmh0-PmKVjprWDg_79nxaHxU';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const message=document.getElementById('message');
const submit=document.getElementById('submit');
const passwordInput=document.getElementById('password');
const confirmInput=document.getElementById('confirm');

function showMessage(text,type){message.textContent=text;message.className='message '+type;}
function clearMessage(){message.textContent='';message.className='message';}
function validPassword(p){return p.length>=6;}

document.querySelectorAll('.pw-toggle').forEach(btn=>btn.addEventListener('click',()=>{
  const i=document.getElementById(btn.dataset.target);
  const visible=i.type==='password';
  i.type=visible?'text':'password';
  btn.classList.toggle('is-visible',visible);
  btn.setAttribute('aria-pressed',String(visible));
  btn.setAttribute('aria-label',visible?'مخفی کردن رمز':'نمایش رمز');
}));

// Supabase may return the recovery session either in the URL hash or through a PKCE code.
async function establishRecoverySession(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'') );
  const query=new URLSearchParams(location.search);
  const access=hash.get('access_token');
  const refresh=hash.get('refresh_token');
  const code=query.get('code');

  if(access && refresh){
    const {error}=await sb.auth.setSession({access_token:access,refresh_token:refresh});
    if(error) throw error;
    return true;
  }

  if(code){
    const {error}=await sb.auth.exchangeCodeForSession(code);
    if(error) throw error;
    return true;
  }

  const {data}=await sb.auth.getSession();
  return !!data.session;
}

// Keep the page ready when Supabase finishes the recovery handshake.
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='PASSWORD_RECOVERY' && session){
    submit.disabled=false;
    clearMessage();
  }
});

async function init(){
  try{
    await establishRecoverySession();
    const {data}=await sb.auth.getSession();
    if(!data.session){
      showMessage('لینک بازیابی رمز معتبر نیست یا منقضی شده است. دوباره درخواست بازیابی رمز بدهید.','error');
      return;
    }
    submit.disabled=false;
  }catch(error){
    console.error(error);
    showMessage('لینک بازیابی رمز معتبر نیست یا منقضی شده است. دوباره درخواست بازیابی رمز بدهید.','error');
  }
}

submit.addEventListener('click',async()=>{
  clearMessage();
  const p=passwordInput.value;
  const c=confirmInput.value;

  if(!validPassword(p)){showMessage('رمز عبور باید حداقل ۶ کاراکتر باشد.','error');return;}
  if(p!==c){showMessage('تکرار رمز عبور با رمز جدید مطابقت ندارد.','error');return;}

  submit.disabled=true;
  submit.textContent='در حال ذخیره...';

  try{
    // Make sure a recovery session exists immediately before updating the password.
    const {data:sessionData}=await sb.auth.getSession();
    if(!sessionData.session){
      await establishRecoverySession();
    }

    const {data:latest,error:sessionError}=await sb.auth.getSession();
    if(sessionError || !latest.session){
      throw new Error('جلسه بازیابی رمز معتبر نیست. لطفاً یک لینک بازیابی جدید دریافت کنید.');
    }

    const {error}=await sb.auth.updateUser({password:p});
    if(error) throw error;

    showMessage('رمز عبور با موفقیت تغییر کرد.','success');
    await sb.auth.signOut();
    setTimeout(()=>{window.location.href='https://daniaapp.ir/';},1000);
  }catch(error){
    console.error(error);
    showMessage(error?.message||'تغییر رمز عبور انجام نشد. دوباره تلاش کنید.','error');
    submit.disabled=false;
    submit.textContent='ذخیره رمز جدید';
  }
});

init();
</script>
</body>
</html>
