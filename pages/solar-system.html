<style>

.lbl.on{background:var(--sel);border-color:rgba(255,200,97,.6);color:#ffe6b8;text-shadow:none}

#x{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:50%;padding:0}
.ph{flex:none;padding:16px 18px 8px;position:relative}
.bd{flex:1;min-height:0;overflow:auto;padding:4px 18px 14px;scrollbar-width:thin;scrollbar-color:#4b4b57 transparent}

.nvb{flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;font-size:.82rem;font-weight:600;text-align:start}

.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

.g b{display:block;color:var(--ink);font-size:.88rem;font-weight:600;line-height:1.5}

.bar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin:5px 0 2px}

.c{margin-bottom:8px;font-size:.84rem}
.c span{display:flex;justify-content:space-between}
.cm .c:nth-child(1) .bar i{background:linear-gradient(90deg,#7c3aed,#c084fc)}
.cm .c:nth-child(2) .bar i{background:linear-gradient(90deg,#f59e0b,#fb7185)}
.cm .c:nth-child(3) .bar i{background:linear-gradient(90deg,#10b981,#a3e635)}
.cm .c:nth-child(4) .bar i{background:linear-gradient(90deg,#0ea5e9,#6366f1)}

}

</style>
</head>
